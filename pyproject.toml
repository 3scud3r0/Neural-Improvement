[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-m-research"
version = "0.3.0"
description = "Experimental NEXUS Evolution architecture: modular learning, causal models, memory, search, controlled source improvement"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "torch>=2.0", "matplotlib>=3.7", "networkx>=3.5", "sympy>=1.12"]

[project.optional-dependencies]
dev = ["pytest>=8"]
neuroos = ["gguf>=0.10", "tiktoken>=0.7"]
neuroos-api = ["fastapi>=0.110", "uvicorn>=0.29"]
smt = ["z3-solver>=4.12"]
triton = ["triton>=3.0; platform_system == 'Linux' and platform_machine == 'x86_64'"]

[project.scripts]
nexus-m = "nexus_m.cli:main"
nexus-evolution = "nexus_m.evolution_cli:main"
nexus-autosynth = "nexus_m.autosynth_cli:main"
nexus-neuroos = "nexus_m.neuroos_bridge:main"
crossjail = "crossjail:main"
nexus-sovereign = "nexus_m.sovereign_improver:main"

[tool.setuptools]
py-modules = ["crossjail"]

[tool.setuptools.package-data]
"nexus_m._vendor" = ["NEUROOS_LICENSE", "neuroos_provenance.json"]

[tool.setuptools.packages.find]
where = ["."]
include = ["nexus_m*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
